<title>D.I.V. Field App — Wireframes v1</title>

<style>
  :root {
    --ground: #F4F2F7;
    --panel: #FFFFFF;
    --panel-2: #EAE6F2;
    --line: #D6D0E4;
    --ink: #1A1626;
    --muted: #5F5878;
    --faint: #8B84A6;
    --purple: #5B2BD9;
    --lime: #5E7A00;
    --amber: #A86100;
    --shadow: 0 24px 60px -30px rgba(26, 22, 38, .45);

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0B0912;
      --panel: #171426;
      --panel-2: #1F1B31;
      --line: #302A47;
      --ink: #EDE9F7;
      --muted: #9A93B5;
      --faint: #6C6489;
      --purple: #8B5CFF;
      --lime: #C9F24D;
      --amber: #F2A23D;
      --shadow: 0 24px 60px -30px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0B0912;
    --panel: #171426;
    --panel-2: #1F1B31;
    --line: #302A47;
    --ink: #EDE9F7;
    --muted: #9A93B5;
    --faint: #6C6489;
    --purple: #8B5CFF;
    --lime: #C9F24D;
    --amber: #F2A23D;
    --shadow: 0 24px 60px -30px rgba(0, 0, 0, .8);
  }

  :root[data-theme="light"] {
    --ground: #F4F2F7;
    --panel: #FFFFFF;
    --panel-2: #EAE6F2;
    --line: #D6D0E4;
    --ink: #1A1626;
    --muted: #5F5878;
    --faint: #8B84A6;
    --purple: #5B2BD9;
    --lime: #5E7A00;
    --amber: #A86100;
    --shadow: 0 24px 60px -30px rgba(26, 22, 38, .45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- workbench masthead ---------- */

  .masthead {
    border-bottom: 1px solid var(--line);
    padding: 20px 28px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 20px 32px;
  }

  .masthead h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin: 0;
  }

  .masthead p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13.5px;
    max-width: 60ch;
  }

  .stripe {
    height: 10px;
    width: 100%;
    background-image: repeating-linear-gradient(
      -45deg,
      var(--purple) 0 10px,
      transparent 10px 20px
    );
    opacity: .55;
  }

  .masthead-meta {
    margin-left: auto;
    display: flex;
    gap: 22px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .masthead-meta b {
    display: block;
    color: var(--ink);
    font-size: 13px;
    letter-spacing: .06em;
    font-weight: 600;
  }

  /* ---------- 3-column workbench ---------- */

  .bench {
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr) minmax(0, 380px);
    gap: 0;
    align-items: start;
    min-height: calc(100vh - 96px);
  }

  /* ---------- rail: the storyboard index ---------- */

  .rail {
    border-right: 1px solid var(--line);
    padding: 22px 0 40px;
    position: sticky;
    top: 0;
    max-height: 100vh;
    overflow-y: auto;
  }

  .rail-group {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 18px 20px 7px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .rail-group:first-child { padding-top: 0; }
  .rail-group::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .rail-item {
    display: flex;
    gap: 10px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 6px 20px 6px 18px;
    cursor: pointer;
    line-height: 1.4;
  }

  .rail-item:hover { color: var(--ink); background: var(--panel-2); }
  .rail-item:focus-visible { outline: 2px solid var(--purple); outline-offset: -2px; }

  .rail-item[aria-current="true"] {
    color: var(--ink);
    border-left-color: var(--lime);
    background: var(--panel-2);
    font-weight: 600;
  }

  .rail-id {
    color: var(--faint);
    font-size: 11px;
    min-width: 20px;
  }

  .rail-item[aria-current="true"] .rail-id { color: var(--lime); }

  /* ---------- stage: the phone ---------- */

  .stage {
    padding: 34px 24px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .phone {
    width: 372px;
    height: 764px;
    flex: none;
    border-radius: 38px;
    padding: 11px;
    background: #14111F;
    border: 1px solid #302A47;
    box-shadow: var(--shadow);
  }

  .glass {
    height: 100%;
    border-radius: 28px;
    overflow: hidden;
    background: #0B0912;
    color: #EDE9F7;
    font-family: var(--mono);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .stage-nav {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .stepper {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 15px;
    cursor: pointer;
  }

  .stepper:hover { border-color: var(--purple); color: var(--purple); }
  .stepper:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  /* ---------- notes panel ---------- */

  .notes {
    border-left: 1px solid var(--line);
    padding: 26px 26px 60px;
    position: sticky;
    top: 0;
    max-height: 100vh;
    overflow-y: auto;
  }

  .notes h2 {
    font-family: var(--mono);
    font-size: 17px;
    letter-spacing: .02em;
    margin: 0;
  }

  .notes-kicker {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 6px;
  }

  .notes-sub {
    color: var(--muted);
    font-size: 13.5px;
    margin: 8px 0 0;
  }

  .note-block { margin-top: 24px; }

  .note-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--faint);
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 9px;
  }

  .note-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .note-block ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .note-block li {
    font-size: 13.5px;
    color: var(--muted);
    padding-left: 15px;
    position: relative;
  }

  .note-block li::before {
    content: "";
    position: absolute;
    left: 0;
    top: .58em;
    width: 6px;
    height: 1px;
    background: var(--faint);
  }

  .note-block li b { color: var(--ink); font-weight: 600; }
  .note-block li code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--panel-2);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--ink);
  }

  .q-block li::before { background: var(--amber); width: 6px; height: 6px; border-radius: 50%; top: .45em; }
  .q-block li { color: var(--ink); }

  /* ---------- phone internals ---------- */

  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 10px;
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #6C6489;
    border-bottom: 1px solid #241F38;
    flex: none;
  }

  .statusbar .net { color: #C9F24D; }
  .statusbar .net.off { color: #F2A23D; }

  .screen-host {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .screen {
    flex: 1;
    min-height: 0;
    padding: 22px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .screen.center {
    justify-content: center;
    text-align: center;
    align-items: center;
  }

  .eyebrow {
    font-size: 9.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #8B5CFF;
  }

  .big {
    font-size: 21px;
    line-height: 1.25;
    letter-spacing: .01em;
    text-wrap: balance;
    margin: 0;
  }

  .body-sm {
    font-size: 12.5px;
    line-height: 1.6;
    color: #9A93B5;
    margin: 0;
  }

  .rule { height: 1px; background: #241F38; flex: none; }

  .tap {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--mono);
    font-size: 13px;
    color: #EDE9F7;
    background: #171426;
    border: 1px solid #302A47;
    border-radius: 4px;
    padding: 13px 14px;
    cursor: pointer;
  }

  .tap:hover { border-color: #8B5CFF; background: #1F1B31; }
  .tap:focus-visible { outline: 2px solid #C9F24D; outline-offset: 2px; }

  .tap-primary {
    background: #8B5CFF;
    border-color: #8B5CFF;
    color: #0B0912;
    font-weight: 700;
    text-align: center;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: 11.5px;
    padding: 14px;
  }

  .tap-primary:hover { background: #A47CFF; border-color: #A47CFF; }

  .tap-ghost {
    background: none;
    border-color: #302A47;
    color: #9A93B5;
    text-align: center;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: 11px;
    padding: 12px;
  }

  .tap-lime {
    background: #C9F24D;
    border-color: #C9F24D;
    color: #0B0912;
    font-weight: 700;
    text-align: center;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: 11.5px;
    padding: 14px;
  }

  .stack { display: flex; flex-direction: column; gap: 9px; }
  .spacer { flex: 1; }

  /* the badge — the app's central object */

  .badge-card {
    border: 1px solid #302A47;
    border-radius: 6px;
    background: #12101C;
    overflow: hidden;
  }

  .badge-head {
    background-image: repeating-linear-gradient(-45deg, rgba(139,92,255,.5) 0 8px, transparent 8px 16px);
    border-bottom: 1px solid #302A47;
    padding: 7px 12px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #EDE9F7;
  }

  .badge-body { padding: 16px 14px; display: flex; gap: 14px; }

  .sprite {
    width: 96px;
    height: 112px;
    flex: none;
    border: 1px dashed #4A4170;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    background: #0E0C17;
    position: relative;
  }

  .sprite.aura { box-shadow: 0 0 0 1px rgba(201,242,77,.35), 0 0 22px -4px rgba(201,242,77,.5); }

  .sprite-slot {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #6C6489;
    border-bottom: 1px dashed #302A47;
  }

  .sprite-slot:last-child { border-bottom: 0; }
  .sprite-slot.filled { color: #C9F24D; }

  .sprite-tag {
    position: absolute;
    bottom: -1px;
    right: -1px;
    font-size: 7.5px;
    letter-spacing: .1em;
    background: #302A47;
    color: #9A93B5;
    padding: 1px 4px;
  }

  .field-list { display: flex; flex-direction: column; gap: 7px; min-width: 0; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .field dt {
    font-size: 8px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #6C6489;
  }

  .field dd {
    margin: 0;
    font-size: 12px;
    color: #EDE9F7;
    letter-spacing: .02em;
  }

  .field dd.lime { color: #C9F24D; }
  .field dd.pending { color: #F2A23D; }

  .agent-name {
    font-size: 17px;
    letter-spacing: .06em;
    margin: 0;
  }

  .counter {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border: 1px solid #302A47;
    border-radius: 4px;
    padding: 10px 12px;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #6C6489;
  }

  .counter b {
    font-size: 15px;
    color: #C9F24D;
    letter-spacing: .04em;
    font-variant-numeric: tabular-nums;
  }

  .meter { height: 3px; background: #241F38; border-radius: 2px; overflow: hidden; }
  .meter span { display: block; height: 100%; background: #C9F24D; }

  /* quiz */

  .q-count {
    font-size: 9.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #6C6489;
  }

  .fake-input {
    border: 1px solid #302A47;
    border-bottom-color: #8B5CFF;
    background: #12101C;
    border-radius: 4px;
    padding: 14px;
    font-size: 15px;
    color: #EDE9F7;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .caret {
    width: 8px;
    height: 17px;
    background: #C9F24D;
    animation: blink 1.1s steps(2, start) infinite;
  }

  @keyframes blink { to { visibility: hidden; } }

  .char-cap {
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #6C6489;
    text-align: right;
  }

  /* HQ board */

  .board {
    flex: 1;
    border: 1px solid #302A47;
    border-radius: 6px;
    background: #0E0C17;
    background-image: radial-gradient(circle at 18% 24%, rgba(139,92,255,.12), transparent 45%),
                      radial-gradient(circle at 78% 72%, rgba(201,242,77,.08), transparent 40%);
    position: relative;
    overflow: hidden;
    min-height: 300px;
  }

  .pin {
    position: absolute;
    width: 74px;
    border: 1px solid #302A47;
    background: #171426;
    border-radius: 3px;
    padding: 5px;
    cursor: pointer;
    text-align: center;
  }

  .pin:hover { border-color: #8B5CFF; }
  .pin:focus-visible { outline: 2px solid #C9F24D; outline-offset: 2px; }

  .pin-sprite {
    height: 30px;
    border: 1px dashed #4A4170;
    border-radius: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 7px;
    color: #6C6489;
    letter-spacing: .1em;
    margin-bottom: 4px;
  }

  .pin-name { font-size: 8px; letter-spacing: .06em; color: #EDE9F7; }
  .pin-msg { font-size: 7.5px; color: #9A93B5; margin-top: 2px; line-height: 1.3; }

  .envelope {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 26px;
    height: 18px;
    border: 1px solid #C9F24D;
    border-radius: 2px;
    background: rgba(201,242,77,.14);
    cursor: pointer;
    box-shadow: 0 0 14px -2px rgba(201,242,77,.7);
    animation: pulse 2.4s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    color: #C9F24D;
  }

  @keyframes pulse {
    50% { box-shadow: 0 0 22px 1px rgba(201,242,77,.95); }
  }

  @media (prefers-reduced-motion: reduce) {
    .envelope, .caret { animation: none; }
  }

  .tabs { display: flex; gap: 0; border: 1px solid #302A47; border-radius: 4px; overflow: hidden; flex: none; }

  .tabs button {
    flex: 1;
    background: #12101C;
    border: 0;
    border-right: 1px solid #302A47;
    color: #9A93B5;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 9px 4px;
    cursor: pointer;
  }

  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { background: #1F1B31; color: #C9F24D; }

  /* leaderboard */

  .lb { display: flex; flex-direction: column; }

  .lb-row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px 2px;
    border-bottom: 1px solid #241F38;
    font-size: 12px;
  }

  .lb-rank { color: #6C6489; font-variant-numeric: tabular-nums; font-size: 11px; }
  .lb-row.me { color: #C9F24D; }
  .lb-count { font-variant-numeric: tabular-nums; color: #9A93B5; }
  .lb-row.me .lb-count { color: #C9F24D; }

  /* locker */

  .slot-row {
    border: 1px solid #302A47;
    border-radius: 4px;
    padding: 11px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .slot-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #6C6489;
  }

  .slot-head b { color: #EDE9F7; font-size: 11.5px; letter-spacing: .04em; font-weight: 600; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  .chip {
    border: 1px dashed #4A4170;
    border-radius: 3px;
    background: #12101C;
    width: 38px;
    height: 38px;
    font-size: 7px;
    color: #6C6489;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-align: center;
    line-height: 1.2;
    padding: 2px;
  }

  .chip:hover { border-color: #8B5CFF; }
  .chip[aria-pressed="true"] { border-style: solid; border-color: #C9F24D; color: #C9F24D; }

  .chip.locked { color: #302A47; border-color: #241F38; cursor: default; }

  /* reveal / edge states */

  .seal {
    width: 116px;
    height: 116px;
    border: 1px solid #8B5CFF;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 8px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #8B5CFF;
    box-shadow: 0 0 40px -12px rgba(139,92,255,.9);
  }

  .seal b { font-size: 26px; letter-spacing: .04em; color: #EDE9F7; }

  .callout {
    border: 1px solid #302A47;
    border-left: 2px solid #F2A23D;
    background: #12101C;
    border-radius: 3px;
    padding: 11px 12px;
    font-size: 11.5px;
    color: #9A93B5;
    line-height: 1.55;
  }

  .callout.lime { border-left-color: #C9F24D; }
  .callout b { color: #EDE9F7; }

  .reading {
    font-size: 12.5px;
    color: #C9F24D;
    line-height: 1.6;
    font-style: italic;
  }

  .assignment { font-size: 13px; line-height: 1.65; color: #EDE9F7; margin: 0; }

  .toast {
    border: 1px solid #302A47;
    background: #1F1B31;
    border-radius: 4px;
    padding: 9px 11px;
    font-size: 10.5px;
    letter-spacing: .06em;
    color: #9A93B5;
    text-align: center;
    flex: none;
  }

  .kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--muted);
  }

  @media (max-width: 1180px) {
    .bench { grid-template-columns: 200px minmax(0, 1fr); }
    .notes { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); position: static; max-height: none; }
  }

  @media (max-width: 780px) {
    .bench { grid-template-columns: 1fr; }
    .rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
    .phone { width: 100%; max-width: 372px; }
  }
</style>

<div class="stripe"></div>

<header class="masthead">
  <div>
    <h1>D.I.V. Field App — Wireframes v1</h1>
    <p>Storyboard for the Seven Stars collection game. Tap inside the phone — quiz options, buttons and board pins are live. Arrow keys step the whole flow.</p>
  </div>
  <div class="masthead-meta">
    <div>Screens<b id="metaCount">—</b></div>
    <div>Flows<b>5</b></div>
    <div>Fidelity<b>Wireframe</b></div>
  </div>
</header>

<div class="bench">
  <nav class="rail" id="rail" aria-label="Storyboard index"></nav>

  <div class="stage">
    <div class="phone">
      <div class="glass">
        <div class="statusbar">
          <span>D.I.V. FIELD TERMINAL</span>
          <span class="net" id="net">GRID LINK OK</span>
        </div>
        <div class="screen-host" id="screenHost"></div>
      </div>
    </div>

    <div class="stage-nav">
      <button class="stepper" id="prev" type="button">← Prev</button>
      <span id="pos">— / —</span>
      <button class="stepper" id="next" type="button">Next →</button>
      <span><span class="kbd">←</span> <span class="kbd">→</span></span>
    </div>
  </div>

  <aside class="notes" id="notes" aria-live="polite"></aside>
</div>

<script>
  // ---------- reusable phone chunks ----------

  const sprite = (opts = {}) => {
    const { hat = "HAT", body = "BODY", item = "ITEM", aura = true, tag = "48×48" } = opts;
    const slot = (label, filled) =>
      '<div class="sprite-slot' + (filled ? " filled" : "") + '">' + label + "</div>";
    return (
      '<div class="sprite' + (aura ? " aura" : "") + '">' +
      slot(hat, hat !== "HAT") +
      slot(body, body !== "BODY") +
      slot(item, item !== "ITEM") +
      '<span class="sprite-tag">' + tag + "</span></div>"
    );
  };

  const field = (label, value, cls = "") =>
    '<dl class="field"><dt>' + label + '</dt><dd class="' + cls + '">' + value + "</dd></dl>";

  const badge = (opts = {}) => {
    const {
      name = "AGENT NOVA",
      desig = "Signal Lamp Operator",
      code = "SL-04",
      freq = "Nuclear Lime",
      status = "Causing It",
      held = "Lantern",
      heldCls = "lime",
      spriteOpts = { hat: "BANANA", body: "HI-VIS", item: "LANTERN" },
      head = "PROVISIONAL FIELD AGENT",
    } = opts;
    return (
      '<div class="badge-card">' +
        '<div class="badge-head"><span>' + head + "</span><span>" + code + "</span></div>" +
        '<div class="badge-body">' +
          sprite(spriteOpts) +
          '<div class="field-list">' +
            '<p class="agent-name">' + name + "</p>" +
            field("Designation", desig) +
            field("Frequency", freq, "lime") +
            field("Status", status) +
            field("Held", held, heldCls) +
          "</div>" +
        "</div>" +
      "</div>"
    );
  };

  const pin = (x, y, name, msg, label = "BADGE") =>
    '<button class="pin" data-goto="h3" style="left:' + x + "%;top:" + y + '%">' +
      '<div class="pin-sprite">' + label + "</div>" +
      '<div class="pin-name">' + name + "</div>" +
      (msg ? '<div class="pin-msg">' + msg + "</div>" : "") +
    "</button>";

  const lbRow = (rank, name, count, me = false) =>
    '<div class="lb-row' + (me ? " me" : "") + '">' +
      '<span class="lb-rank">' + rank + "</span><span>" + name + '</span><span class="lb-count">' + count + "</span></div>";

  // ---------- the storyboard ----------

  // ---------- render ----------

  const railEl = document.getElementById("rail");
  const hostEl = document.getElementById("screenHost");
  const notesEl = document.getElementById("notes");
  const netEl = document.getElementById("net");
  const posEl = document.getElementById("pos");

  let current = 0;

  document.getElementById("metaCount").textContent = SCREENS.length;

  // rail, grouped by flow
  let lastGroup = null;
  SCREENS.forEach((s, i) => {
    if (s.group !== lastGroup) {
      const g = document.createElement("div");
      g.className = "rail-group";
      g.innerHTML = "<span>" + s.group + "</span>";
      railEl.appendChild(g);
      lastGroup = s.group;
    }
    const b = document.createElement("button");
    b.className = "rail-item";
    b.type = "button";
    b.dataset.index = i;
    b.innerHTML = '<span class="rail-id">' + s.id.toUpperCase() + "</span><span>" + s.label + "</span>";
    b.addEventListener("click", () => show(i));
    railEl.appendChild(b);
  });

  const list = (items, cls) =>
    !items || !items.length
      ? ""
      : '<ul class="' + (cls || "") + '">' + items.map((t) => "<li>" + t + "</li>").join("") + "</ul>";

  const block = (label, items, cls) =>
    !items || !items.length
      ? ""
      : '<div class="note-block"><div class="note-label"><span>' + label + "</span></div>" + list(items, cls) + "</div>";

  function show(i) {
    current = (i + SCREENS.length) % SCREENS.length;
    const s = SCREENS[current];

    hostEl.innerHTML = s.html;
    hostEl.querySelectorAll("[data-goto]").forEach((el) => {
      el.addEventListener("click", () => {
        const idx = SCREENS.findIndex((x) => x.id === el.dataset.goto);
        if (idx > -1) show(idx);
      });
    });

    netEl.textContent = s.net === "off" ? "NO GRID LINK" : "GRID LINK OK";
    netEl.className = s.net === "off" ? "net off" : "net";

    posEl.textContent = current + 1 + " / " + SCREENS.length;

    notesEl.innerHTML =
      '<div class="notes-kicker">' + s.id.toUpperCase() + " · " + s.group + "</div>" +
      "<h2>" + s.title + "</h2>" +
      '<p class="notes-sub">' + s.sub + "</p>" +
      block("Why this screen exists", [s.purpose]) +
      block("Interactions", s.interactions) +
      block("State &amp; data", s.state) +
      block("Notes", s.notes) +
      block("Open questions", s.questions, "q-block");

    railEl.querySelectorAll(".rail-item").forEach((el) => {
      el.setAttribute("aria-current", String(Number(el.dataset.index) === current));
    });

    const active = railEl.querySelector('[aria-current="true"]');
    if (active) active.scrollIntoView({ block: "nearest" });
    notesEl.scrollTop = 0;
  }

  document.getElementById("prev").addEventListener("click", () => show(current - 1));
  document.getElementById("next").addEventListener("click", () => show(current + 1));

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    if (e.key === "ArrowLeft") { show(current - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { show(current + 1); e.preventDefault(); }
  });

  // locker + board chips: local toggle so the wireframe feels alive
  hostEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip || chip.classList.contains("locked")) return;
    const row = chip.closest(".slot-row");
    if (!row) return; // chips on another agent's card are read-only
    row.querySelectorAll(".chip").forEach((c) => c.removeAttribute("aria-pressed"));
    chip.setAttribute("aria-pressed", "true");
  });

  show(0);
</script>
