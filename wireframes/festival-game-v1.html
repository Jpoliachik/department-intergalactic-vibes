<title>D.I.V. Field App — Wireframes v2</title>

<style>
  :root {
    --ground: #F4F2F7;
    --panel: #FFFFFF;
    --panel-2: #EAE6F2;
    --line: #D6D0E4;
    --ink: #1A1626;
    --muted: #5F5878;
    --faint: #8B84A6;
    --purple: #5B2BD9;
    --lime: #5E7A00;
    --amber: #A86100;
    --shadow: 0 24px 60px -30px rgba(26, 22, 38, .45);

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "IBM Plex Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0B0912;
      --panel: #171426;
      --panel-2: #1F1B31;
      --line: #302A47;
      --ink: #EDE9F7;
      --muted: #9A93B5;
      --faint: #6C6489;
      --purple: #8B5CFF;
      --lime: #C9F24D;
      --amber: #F2A23D;
      --shadow: 0 24px 60px -30px rgba(0, 0, 0, .8);
    }
  }

  :root[data-theme="dark"] {
    --ground: #0B0912;
    --panel: #171426;
    --panel-2: #1F1B31;
    --line: #302A47;
    --ink: #EDE9F7;
    --muted: #9A93B5;
    --faint: #6C6489;
    --purple: #8B5CFF;
    --lime: #C9F24D;
    --amber: #F2A23D;
    --shadow: 0 24px 60px -30px rgba(0, 0, 0, .8);
  }

  :root[data-theme="light"] {
    --ground: #F4F2F7;
    --panel: #FFFFFF;
    --panel-2: #EAE6F2;
    --line: #D6D0E4;
    --ink: #1A1626;
    --muted: #5F5878;
    --faint: #8B84A6;
    --purple: #5B2BD9;
    --lime: #5E7A00;
    --amber: #A86100;
    --shadow: 0 24px 60px -30px rgba(26, 22, 38, .45);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- workbench chrome ---------- */

  .stripe {
    height: 10px;
    background-image: repeating-linear-gradient(-45deg, var(--purple) 0 10px, transparent 10px 20px);
    opacity: .55;
  }

  .masthead {
    border-bottom: 1px solid var(--line);
    padding: 20px 28px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 20px 32px;
  }

  .masthead h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin: 0;
  }

  .masthead p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13.5px;
    max-width: 62ch;
  }

  .masthead-meta {
    margin-left: auto;
    display: flex;
    gap: 22px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .masthead-meta b {
    display: block;
    color: var(--ink);
    font-size: 13px;
    letter-spacing: .06em;
    font-weight: 600;
  }

  .bench {
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr) minmax(0, 380px);
    align-items: start;
    min-height: calc(100vh - 96px);
  }

  /* ---------- rail ---------- */

  .rail {
    border-right: 1px solid var(--line);
    padding: 22px 0 40px;
    position: sticky;
    top: 0;
    max-height: 100vh;
    overflow-y: auto;
  }

  .rail-group {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 18px 20px 7px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .rail-group:first-child { padding-top: 0; }
  .rail-group::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .rail-item {
    display: flex;
    gap: 10px;
    align-items: baseline;
    width: 100%;
    text-align: left;
    background: none;
    border: 0;
    border-left: 2px solid transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 6px 20px 6px 18px;
    cursor: pointer;
    line-height: 1.4;
  }

  .rail-item:hover { color: var(--ink); background: var(--panel-2); }
  .rail-item:focus-visible { outline: 2px solid var(--purple); outline-offset: -2px; }

  .rail-item[aria-current="true"] {
    color: var(--ink);
    border-left-color: var(--lime);
    background: var(--panel-2);
    font-weight: 600;
  }

  .rail-id { color: var(--faint); font-size: 11px; min-width: 20px; }
  .rail-item[aria-current="true"] .rail-id { color: var(--lime); }

  /* ---------- stage ---------- */

  .stage {
    padding: 34px 24px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .phone {
    width: 372px;
    height: 764px;
    flex: none;
    border-radius: 38px;
    padding: 11px;
    background: #14111F;
    border: 1px solid #302A47;
    box-shadow: var(--shadow);
  }

  .glass {
    height: 100%;
    border-radius: 28px;
    overflow: hidden;
    background: #0B0912;
    color: #EDE9F7;
    font-family: var(--mono);
    font-size: 13px;
    display: flex;
    flex-direction: column;
  }

  .stage-nav {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .stepper {
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 15px;
    cursor: pointer;
  }

  .stepper:hover { border-color: var(--purple); color: var(--purple); }
  .stepper:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .kbd {
    font-family: var(--mono);
    font-size: 10.5px;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--muted);
  }

  /* ---------- notes ---------- */

  .notes {
    border-left: 1px solid var(--line);
    padding: 26px 26px 60px;
    position: sticky;
    top: 0;
    max-height: 100vh;
    overflow-y: auto;
  }

  .notes h2 { font-family: var(--mono); font-size: 17px; letter-spacing: .02em; margin: 0; }

  .notes-kicker {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 6px;
  }

  .notes-sub { color: var(--muted); font-size: 13.5px; margin: 8px 0 0; }
  .note-block { margin-top: 24px; }

  .note-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--faint);
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 9px;
  }

  .note-label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .note-block ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .note-block li { font-size: 13.5px; color: var(--muted); padding-left: 15px; position: relative; }

  .note-block li::before {
    content: "";
    position: absolute;
    left: 0;
    top: .58em;
    width: 6px;
    height: 1px;
    background: var(--faint);
  }

  .note-block li b { color: var(--ink); font-weight: 600; }

  .note-block li code {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--panel-2);
    border-radius: 3px;
    padding: 1px 5px;
    color: var(--ink);
  }

  .q-block li { color: var(--ink); }
  .q-block li::before { background: var(--amber); width: 6px; height: 6px; border-radius: 50%; top: .45em; }

  /* ================= PHONE INTERNALS ================= */

  .statusbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 15px 9px;
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: #6C6489;
    border-bottom: 1px solid #241F38;
    flex: none;
  }

  .statusbar .net { color: #C9F24D; }
  .statusbar .net.off { color: #F2A23D; }

  .screen-host { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .screen {
    flex: 1;
    min-height: 0;
    padding: 20px 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .screen.center { justify-content: center; text-align: center; align-items: center; }

  /* pairs with the trailing .spacer so content optically centers above the buttons
     instead of hugging the top; collapses to nothing when content is tall */
  .screen.center::before { content: ""; flex: 1; }
  .spacer { flex: 1; min-height: 6px; }
  .rule { height: 1px; background: #241F38; flex: none; }
  .stack { display: flex; flex-direction: column; gap: 8px; }

  .eyebrow {
    font-size: 9.5px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #8B5CFF;
    flex: none;
  }

  .big {
    font-size: 22px;
    line-height: 1.22;
    letter-spacing: .01em;
    text-wrap: balance;
    margin: 0;
  }

  .huge {
    font-size: 27px;
    line-height: 1.15;
    letter-spacing: .06em;
    margin: 0;
  }

  .sub {
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: #6C6489;
    margin: 0;
  }

  .line { font-size: 12.5px; line-height: 1.55; color: #9A93B5; margin: 0; }

  /* --- ART: the game-feel layer --- */

  .art {
    font-size: 68px;
    line-height: 1;
    filter: drop-shadow(0 0 18px rgba(139, 92, 255, .75));
    flex: none;
  }

  .art.lime { filter: drop-shadow(0 0 20px rgba(201, 242, 77, .8)); }
  .art.dim { filter: none; opacity: .35; }
  .art.amber { filter: drop-shadow(0 0 16px rgba(242, 162, 61, .7)); }

  .seal {
    width: 122px;
    height: 122px;
    flex: none;
    border: 1px solid #8B5CFF;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 52px;
    line-height: 1;
    background: radial-gradient(circle, rgba(139, 92, 255, .22), transparent 68%);
    box-shadow: 0 0 44px -10px rgba(139, 92, 255, .9), inset 0 0 24px -8px rgba(139, 92, 255, .8);
  }

  .seal.lime {
    border-color: #C9F24D;
    background: radial-gradient(circle, rgba(201, 242, 77, .2), transparent 68%);
    box-shadow: 0 0 44px -10px rgba(201, 242, 77, .9), inset 0 0 24px -8px rgba(201, 242, 77, .7);
  }

  .seal.grey {
    border-color: #4A4170;
    background: none;
    box-shadow: none;
    opacity: .6;
  }

  /* composed character: hat + body + held item */

  .avatar {
    width: 118px;
    height: 132px;
    flex: none;
    position: relative;
    border: 1px solid #302A47;
    border-radius: 6px;
    background: radial-gradient(circle at 50% 40%, rgba(139, 92, 255, .16), transparent 62%), #0E0C17;
    overflow: hidden;
  }

  .avatar.aura { box-shadow: inset 0 0 26px -8px rgba(201, 242, 77, .55), 0 0 16px -6px rgba(201, 242, 77, .5); }
  .avatar.aura-violet { box-shadow: inset 0 0 26px -8px rgba(139, 92, 255, .6), 0 0 16px -6px rgba(139, 92, 255, .55); }

  .avatar .lyr { position: absolute; line-height: 1; left: 50%; transform: translateX(-50%); }
  .avatar .hat { top: 12px; font-size: 27px; }
  .avatar .torso { top: 44px; font-size: 46px; }
  .avatar .held { bottom: 10px; left: auto; right: 9px; transform: none; font-size: 24px; }
  .avatar .empty { color: #302A47; font-size: 20px; }

  .avatar-sm {
    width: 46px;
    height: 52px;
    border-radius: 4px;
  }

  .avatar-sm .hat { top: 4px; font-size: 13px; }
  .avatar-sm .torso { top: 18px; font-size: 22px; }
  .avatar-sm .held { bottom: 3px; right: 3px; font-size: 12px; }

  .avatar-xs {
    width: 26px;
    height: 30px;
    border-radius: 3px;
    flex: none;
  }

  .avatar-xs .hat { top: 2px; font-size: 8px; }
  .avatar-xs .torso { top: 10px; font-size: 13px; }
  .avatar-xs .held { display: none; }

  /* --- badge --- */

  .badge-card {
    border: 1px solid #302A47;
    border-radius: 6px;
    background: #12101C;
    overflow: hidden;
    flex: none;
  }

  .badge-head {
    background-image: repeating-linear-gradient(-45deg, rgba(139, 92, 255, .5) 0 8px, transparent 8px 16px);
    border-bottom: 1px solid #302A47;
    padding: 6px 11px;
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .badge-body { padding: 14px 12px; display: flex; gap: 13px; align-items: center; }
  .badge-info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .badge-name { font-size: 16px; letter-spacing: .05em; margin: 0; }

  .chipbar { display: flex; flex-wrap: wrap; gap: 5px; }

  .ichip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    border: 1px solid #302A47;
    border-radius: 3px;
    background: #171426;
    padding: 3px 6px;
    font-size: 10px;
    letter-spacing: .04em;
    color: #EDE9F7;
    white-space: nowrap;
  }

  .ichip.lime { border-color: rgba(201, 242, 77, .5); color: #C9F24D; }
  .ichip.amber { border-color: rgba(242, 162, 61, .5); color: #F2A23D; }
  .ichip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* --- progress as pips, not prose --- */

  .progress { display: flex; flex-direction: column; gap: 6px; flex: none; }

  .pips { display: flex; flex-wrap: wrap; gap: 3px; }

  .pip {
    width: 9px;
    height: 9px;
    border: 1px solid #302A47;
    border-radius: 1px;
    flex: none;
  }

  .pip.on { background: #C9F24D; border-color: #C9F24D; }
  .pip.new { background: #C9F24D; border-color: #C9F24D; box-shadow: 0 0 8px 1px rgba(201, 242, 77, .9); }

  .progress-cap {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: #6C6489;
  }

  .progress-cap b { color: #C9F24D; font-variant-numeric: tabular-nums; }

  /* --- buttons --- */

  .tap {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    font-family: var(--mono);
    font-size: 12.5px;
    color: #EDE9F7;
    background: #171426;
    border: 1px solid #302A47;
    border-radius: 4px;
    padding: 12px 13px;
    cursor: pointer;
    text-align: left;
  }

  .tap:hover { border-color: #8B5CFF; background: #1F1B31; }
  .tap:focus-visible { outline: 2px solid #C9F24D; outline-offset: 2px; }
  .tap .ico { font-size: 16px; line-height: 1; flex: none; }

  .tap-primary {
    background: #8B5CFF;
    border-color: #8B5CFF;
    color: #0B0912;
    font-weight: 700;
    justify-content: center;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: 11.5px;
    padding: 13px;
  }

  .tap-primary:hover { background: #A47CFF; border-color: #A47CFF; }

  .tap-lime {
    background: #C9F24D;
    border-color: #C9F24D;
    color: #0B0912;
    font-weight: 700;
    justify-content: center;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: 11.5px;
    padding: 13px;
  }

  .tap-ghost {
    background: none;
    border-color: #302A47;
    color: #9A93B5;
    justify-content: center;
    letter-spacing: .1em;
    text-transform: uppercase;
    font-size: 10.5px;
    padding: 11px;
  }

  /* --- 2x2 option grid --- */

  .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: none; }

  .opt {
    aspect-ratio: 1 / .82;
    border: 1px solid #302A47;
    border-radius: 5px;
    background: #12101C;
    color: #EDE9F7;
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 9px;
    cursor: pointer;
    padding: 8px;
  }

  .opt:hover { border-color: #8B5CFF; background: #1F1B31; }
  .opt:focus-visible { outline: 2px solid #C9F24D; outline-offset: 2px; }
  .opt .ico { font-size: 30px; line-height: 1; }

  .opt .lab {
    font-size: 9.5px;
    letter-spacing: .11em;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.35;
    color: #9A93B5;
  }

  .opt .swatch { width: 34px; height: 34px; border-radius: 50%; }

  /* --- input --- */

  .fake-input {
    border: 1px solid #302A47;
    border-bottom-color: #8B5CFF;
    background: #12101C;
    border-radius: 4px;
    padding: 15px 14px;
    font-size: 17px;
    letter-spacing: .05em;
    color: #EDE9F7;
    display: flex;
    align-items: center;
    flex: none;
  }

  .caret { width: 9px; height: 19px; background: #C9F24D; animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  .cap { font-size: 9px; letter-spacing: .14em; color: #6C6489; text-align: right; flex: none; }

  /* --- HQ board --- */

  .tabs { display: flex; border: 1px solid #302A47; border-radius: 4px; overflow: hidden; flex: none; }

  .tabs button {
    flex: 1;
    background: #12101C;
    border: 0;
    border-right: 1px solid #302A47;
    color: #9A93B5;
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    padding: 9px 4px;
    cursor: pointer;
  }

  .tabs button:last-child { border-right: 0; }
  .tabs button[aria-selected="true"] { background: #1F1B31; color: #C9F24D; }

  .board {
    flex: 1;
    min-height: 290px;
    border: 1px solid #302A47;
    border-radius: 6px;
    background: #0E0C17;
    background-image: radial-gradient(circle at 18% 22%, rgba(139, 92, 255, .14), transparent 46%),
                      radial-gradient(circle at 80% 74%, rgba(201, 242, 77, .09), transparent 42%);
    position: relative;
    overflow: hidden;
  }

  .pin {
    position: absolute;
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    width: 66px;
  }

  .pin:focus-visible { outline: 2px solid #C9F24D; outline-offset: 3px; border-radius: 4px; }
  .pin:hover .avatar { border-color: #8B5CFF; }
  .pin-name { font-size: 8px; letter-spacing: .06em; color: #EDE9F7; }

  .pin-msg {
    font-size: 7.5px;
    color: #9A93B5;
    line-height: 1.3;
    border: 1px solid #302A47;
    border-radius: 2px;
    background: #12101C;
    padding: 1px 3px;
  }

  .envelope {
    position: absolute;
    right: 11px;
    bottom: 11px;
    border: 0;
    background: none;
    font-size: 21px;
    line-height: 1;
    cursor: pointer;
    filter: drop-shadow(0 0 9px rgba(201, 242, 77, .95));
    animation: pulse 2.4s ease-in-out infinite;
    padding: 2px;
  }

  /* glow only — never transform: the envelope must be a stationary tap target */
  @keyframes pulse { 50% { filter: drop-shadow(0 0 17px rgba(201, 242, 77, 1)); } }
  @media (prefers-reduced-motion: reduce) { .envelope, .caret { animation: none; } }

  .toast {
    border: 1px solid #302A47;
    background: #1F1B31;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 10px;
    letter-spacing: .06em;
    color: #9A93B5;
    text-align: center;
    flex: none;
  }

  /* --- standings --- */

  .lb { display: flex; flex-direction: column; flex: none; }

  .lb-row {
    display: grid;
    grid-template-columns: 20px 26px 1fr auto;
    gap: 9px;
    align-items: center;
    padding: 7px 2px;
    border-bottom: 1px solid #241F38;
    font-size: 11.5px;
    background: none;
    border-left: 0;
    border-right: 0;
    border-top: 0;
    color: #EDE9F7;
    font-family: var(--mono);
    cursor: pointer;
    text-align: left;
  }

  .lb-row:hover { background: #171426; }
  .lb-rank { color: #6C6489; font-size: 10px; font-variant-numeric: tabular-nums; }
  .lb-row.me, .lb-row.me .lb-count { color: #C9F24D; }

  // ---------- render ----------

  const railEl = document.getElementById("rail");
  const hostEl = document.getElementById("screenHost");
  const notesEl = document.getElementById("notes");
  const netEl = document.getElementById("net");
  const posEl = document.getElementById("pos");

  let current = 0;
  document.getElementById("metaCount").textContent = SCREENS.length;

  let lastGroup = null;
  SCREENS.forEach((s, i) => {
    if (s.group !== lastGroup) {
      const g = document.createElement("div");
      g.className = "rail-group";
      g.innerHTML = "<span>" + s.group + "</span>";
      railEl.appendChild(g);
      lastGroup = s.group;
    }
    const b = document.createElement("button");
    b.className = "rail-item";
    b.type = "button";
    b.dataset.index = i;
    b.innerHTML = '<span class="rail-id">' + s.id.toUpperCase() + "</span><span>" + s.label + "</span>";
    b.addEventListener("click", () => show(i));
    railEl.appendChild(b);
  });

  const block = (label, items, cls) =>
    !items || !items.length
      ? ""
      : '<div class="note-block"><div class="note-label"><span>' + label + "</span></div><ul class=\"" +
        (cls || "") + "\">" + items.map((t) => "<li>" + t + "</li>").join("") + "</ul></div>";

  function show(i) {
    current = (i + SCREENS.length) % SCREENS.length;
    const s = SCREENS[current];

    hostEl.innerHTML = s.html;
    hostEl.querySelectorAll("[data-goto]").forEach((el) => {
      el.addEventListener("click", () => {
        const idx = SCREENS.findIndex((x) => x.id === el.dataset.goto);
        if (idx > -1) show(idx);
      });
    });

    netEl.textContent = s.net === "off" ? "⚠ NO LINK" : "📡 LINKED";
    netEl.className = s.net === "off" ? "net off" : "net";
    posEl.textContent = current + 1 + " / " + SCREENS.length;

    notesEl.innerHTML =
      '<div class="notes-kicker">' + s.id.toUpperCase() + " · " + s.group + "</div>" +
      "<h2>" + s.title + "</h2>" +
      '<p class="notes-sub">' + s.sub + "</p>" +
      block("Why this screen exists", [s.purpose]) +
      block("Interactions", s.interactions) +
      block("State &amp; data", s.state) +
      block("Notes", s.notes) +
      block("Open questions", s.questions, "q-block");

    railEl.querySelectorAll(".rail-item").forEach((el) => {
      el.setAttribute("aria-current", String(Number(el.dataset.index) === current));
    });

    const active = railEl.querySelector('[aria-current="true"]');
    if (active) active.scrollIntoView({ block: "nearest" });
    notesEl.scrollTop = 0;
  }

  document.getElementById("prev").addEventListener("click", () => show(current - 1));
  document.getElementById("next").addEventListener("click", () => show(current + 1));

  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input, textarea")) return;
    if (e.key === "ArrowLeft") { show(current - 1); e.preventDefault(); }
    if (e.key === "ArrowRight") { show(current + 1); e.preventDefault(); }
  });

  // locker: tapping a chip equips it
  hostEl.addEventListener("click", (e) => {
    const chip = e.target.closest("button.chip");
    if (!chip || chip.classList.contains("locked")) return;
    const row = chip.closest(".slot-row");
    if (!row) return;
    row.querySelectorAll(".chip").forEach((c) => c.removeAttribute("aria-pressed"));
    chip.setAttribute("aria-pressed", "true");
  });

  show(0);
</script>
